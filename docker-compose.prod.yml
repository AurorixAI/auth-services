# ==============================================================================
# ALGO V1 - Production Docker Compose (Full Stack)
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # ============================================================================
  # NGINX - Reverse Proxy (Entry Point)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: algo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      landing:
        condition: service_started
    restart: unless-stopped
    networks:
      - algo-network

  # ============================================================================
  # API - FastAPI Backend
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: algo-api
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://algo:algo_password@postgres:5432/algo_v1
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production_32chars!}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_jwt_secret_key_here!}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MATHPIX_APP_ID=${MATHPIX_APP_ID:-}
      - MATHPIX_APP_KEY=${MATHPIX_APP_KEY:-}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - algo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ============================================================================
  # FRONTEND - Next.js Platform
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algo-frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - algo-network

  # ============================================================================
  # LANDING - Vite Static Site
  # ============================================================================
  landing:
    build:
      context: ./Elite-Assets
      dockerfile: Dockerfile
    container_name: algo-landing
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - algo-network

  # ============================================================================
  # DATABASE - PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: algo-postgres
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algo_password}
      POSTGRES_DB: algo_v1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_v1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-network

  # ============================================================================
  # CACHE & SESSIONS - Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: algo-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-network

  # ============================================================================
  # pgAdmin 4 - Database Management UI
  # http://localhost:5050  |  admin@algo.dev / admin
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: algo-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@algo.dev
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
    entrypoint: >
      /bin/sh -c "
      cp /pgadmin4/pgpass /tmp/pgpassfile &&
      chmod 600 /tmp/pgpassfile &&
      /entrypoint.sh
      "
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - algo-network

  # ============================================================================
  # MONITORING (Optional) - docker compose --profile monitoring up
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: algo-prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - algo-network

  grafana:
    image: grafana/grafana:latest
    container_name: algo-grafana
    profiles:
      - monitoring
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - algo-network

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  algo-network:
    driver: bridge
