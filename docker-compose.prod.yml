# ==============================================================================
# ALGO Auth Service — Production Docker Compose
# Differences from docker-compose.yml:
#   - No default values for secrets (fail-fast if env not set)
#   - Healthcheck uses /health/live (no DB dependency, instant)
#   - Postgres port NOT exposed to host (only internal network)
# ==============================================================================

name: algo-back

services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: algo-auth:latest
    container_name: algo-auth
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MATHPIX_APP_ID=${MATHPIX_APP_ID}
      - MATHPIX_APP_KEY=${MATHPIX_APP_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - EXAM_SERVICE_URL=${EXAM_SERVICE_URL:-http://algo-exam:8003/api/v1}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - algo-network
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:15-alpine
    container_name: algo-postgres
    # NOTE: port NOT exposed in production — only accessible on algo-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-algo_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-algo_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  algo-network:
    external: true
    name: algo-back_algo-network
  shared-network:
    external: true
    name: algo-network
