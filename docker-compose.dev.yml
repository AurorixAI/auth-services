# ==============================================================================
# ALGO V1 - Development Docker Compose
# Use: docker-compose -f docker-compose.dev.yml up
# ==============================================================================

services:
  # ============================================================================
  # APPLICATION (Development Mode with Hot Reload)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: algo-api-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://algo:algo_password@postgres:5432/algo_v1
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src:ro
      - ./database:/app/database:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algo-dev-network

  # ============================================================================
  # DATABASE
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: algo-postgres-dev
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: algo_password
      POSTGRES_DB: algo_v1
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_v1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algo-dev-network

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: algo-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algo-dev-network

  # ============================================================================
  # ADMINER (Database UI)
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: algo-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - algo-dev-network

volumes:
  postgres_dev_data:
    driver: local

networks:
  algo-dev-network:
    driver: bridge
