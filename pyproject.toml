[project]
name = "algo-auth-service"
version = "1.0.0"
description = "ALGO Auth Service — authentication, organizations, students, groups"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.0.0,<4.1.0",
    "fastapi>=0.109.0",
    "gunicorn>=21.2.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "tests/*"]
